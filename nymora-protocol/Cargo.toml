[package]
name = "nymora-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["provisional-algebraic-hash"]
# Forwards the stand-ins through the whole proof stack. The lifecycle operations that
# recompute a leaf or derive a nullifier, and the witness-assembly path into the statement
# types, sit behind this; the sequencing that does not (epoch rollover, sweeps, records)
# compiles without it.
provisional-algebraic-hash = [
    "nymora-crypto/provisional-algebraic-hash",
    "nymora-accumulator/provisional-algebraic-hash",
    "nymora-circuits/provisional-algebraic-hash",
    "nymora-proofs/provisional-algebraic-hash",
]
# The Skiora role (§2.1): agora state, vouch sessions, quorum decisions, verification
# access, migration acceptance, and the transparency log. Off by default so the member
# side stays allocation-free — the operator needs collections (an allocator) and, for log
# heads, the provisional signature. A conformant Skiora wraps this; a Persora never
# enables it.
operator = [
    "provisional-algebraic-hash",
    "nymora-accumulator/build",
    "nymora-crypto/provisional-signature",
]

[dependencies]
nymora-core = { path = "../nymora-core" }
nymora-crypto = { path = "../nymora-crypto", default-features = false }
nymora-circuits = { path = "../nymora-circuits", default-features = false }
nymora-proofs = { path = "../nymora-proofs", default-features = false }
nymora-accumulator = { path = "../nymora-accumulator", default-features = false }
nymora-ports = { path = "../nymora-ports" }
# Memory hygiene for secret bytes staged in local buffers, same version as `nymora-core`.
zeroize = { version = "1", default-features = false }

[dev-dependencies]
nymora-ports = { path = "../nymora-ports", features = ["software-key-store"] }
# The cross-phase tests sign epoch certificates the stub verifies, build the trees and
# sets proofs are cut against, and prove through the stub backend.
nymora-crypto = { path = "../nymora-crypto", default-features = false, features = [
    "provisional-signature",
] }
nymora-accumulator = { path = "../nymora-accumulator", default-features = false, features = [
    "build",
] }
nymora-circuits = { path = "../nymora-circuits", default-features = false, features = [
    "stub-prover",
] }
