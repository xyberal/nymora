[package]
name = "nymora-protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# The Skiora role (§2.1): agora state, vouch sessions, quorum decisions, verification
# access, migration acceptance, and the transparency log. Off by default so the member
# side stays allocation-free — the operator needs collections (an allocator). A
# conformant Skiora wraps this; a Persora never enables it.
operator = ["nymora-accumulator/build"]

[dependencies]
nymora-core = { path = "../nymora-core" }
nymora-crypto = { path = "../nymora-crypto", default-features = false }
nymora-circuits = { path = "../nymora-circuits", default-features = false }
nymora-proofs = { path = "../nymora-proofs", default-features = false }
nymora-accumulator = { path = "../nymora-accumulator", default-features = false }
nymora-ports = { path = "../nymora-ports" }
# Memory hygiene for secret bytes staged in local buffers, same version as `nymora-core`.
zeroize = { version = "1", default-features = false }

[dev-dependencies]
nymora-ports = { path = "../nymora-ports", features = ["software-key-store"] }
# The cross-phase tests sign epoch certificates the stub verifies, build the trees and
# sets proofs are cut against, and prove through the stub backend.
nymora-accumulator = { path = "../nymora-accumulator", default-features = false, features = [
    "build",
] }
nymora-circuits = { path = "../nymora-circuits", default-features = false, features = [
    "stub-prover",
] }
