[package]
name = "nymora-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
nymora-core = { path = "../nymora-core" }
# Byte-hash family (§6.4 requires HMAC, so a conventional hash is permanent, not a
# placeholder). SHA-256 is hardware-accelerated on the arm64 devices Persora targets.
sha2 = { version = "0.10", default-features = false }
hkdf = { version = "0.12", default-features = false }
# §6.4 specifies routing tags as an HMAC.
hmac = { version = "0.12", default-features = false }
# Constant-time comparison and branchless selection for the tag trial loop (§16.4).
subtle = { version = "2", default-features = false }
# The proving field (§6.5, proposal 0033): the algebraic family is Poseidon over the
# BLS12-381 scalar field, implemented here over this crate's `Scalar`. Scalar arithmetic
# only — no groups, no pairings — and `no_std` with no allocator.
bls12_381 = { version = "0.8", default-features = false }
# The certificate curve (§9.1): EdDSA over Jubjub. The proving stack's own curve crate is
# a fork of this one — same encodings, same generator — and the proving backend
# cross-checks the two implementations value for value.
jubjub = { version = "0.10", default-features = false }
ff = { version = "0.13", default-features = false }
group = { version = "0.13", default-features = false }

[dev-dependencies]
# Conformance vectors are JSON so a second implementation in another language can consume them.
# Dev-only: the library itself stays `no_std` with no serialization dependency.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
