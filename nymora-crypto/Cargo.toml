[package]
name = "nymora-crypto"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["provisional-algebraic-hash", "provisional-signature"]
# SHA-256 standing in for the not-yet-chosen algebraic hash, plus the commitments and
# nullifiers derived through it. On by default so the protocol can be built; disable to
# check that the stand-in has not reached something it should not have.
provisional-algebraic-hash = []
# Ed25519 standing in for the not-yet-chosen in-circuit signature scheme (§6.5 fixes it
# with the proving system). Same discipline as the hash: on by default, stripped by
# --no-default-features, sizes never pinned by tests.
provisional-signature = ["dep:ed25519-dalek"]

[dependencies]
nymora-core = { path = "../nymora-core" }
# Byte-hash family (§6.4 requires HMAC, so a conventional hash is permanent, not a
# placeholder). SHA-256 is hardware-accelerated on the arm64 devices Persora targets.
sha2 = { version = "0.10", default-features = false }
hkdf = { version = "0.12", default-features = false }
# §6.4 specifies routing tags as an HMAC.
hmac = { version = "0.12", default-features = false }
# Constant-time comparison and branchless selection for the tag trial loop (§16.4).
subtle = { version = "2", default-features = false }
# The provisional signature only. `digest` enables the prehashed (streaming) API, which is
# what lets signing work without an allocator; `zeroize` erases expanded key material.
ed25519-dalek = { version = "2", default-features = false, features = [
    "digest",
    "zeroize",
], optional = true }

[dev-dependencies]
# Conformance vectors are JSON so a second implementation in another language can consume them.
# Dev-only: the library itself stays `no_std` with no serialization dependency.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
