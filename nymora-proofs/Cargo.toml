[package]
name = "nymora-proofs"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["stub-prover"]
# Forwarded so a caller can select the test proving stack through this crate.
stub-prover = ["nymora-circuits/stub-prover"]

[dependencies]
nymora-core = { path = "../nymora-core" }
nymora-crypto = { path = "../nymora-crypto", default-features = false }
nymora-accumulator = { path = "../nymora-accumulator", default-features = false }
nymora-circuits = { path = "../nymora-circuits", default-features = false }

[dev-dependencies]
# Tests build the trees and sets the proofs are cut against, through the stub backend.
nymora-accumulator = { path = "../nymora-accumulator", default-features = false, features = [
    "build",
] }
nymora-circuits = { path = "../nymora-circuits", default-features = false, features = [
    "stub-prover",
] }
