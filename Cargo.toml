# nymora — the Nymora protocol library.
# See ARCHITECTURE.md for the crate graph and the pure-engine-plus-ports model.
[workspace]
resolver = "2"
# `measure/` is a standalone harness with heavy proving-system dependencies; it stays
# outside the workspace so the library CI, the no_std discipline, and build times are
# untouched. It is built and run on demand — see measure/README.md.
exclude = ["measure", "nymora-plonk"]   # both carry the heavy std proving stack
members = [
    "nymora-core",
    "nymora-crypto",
    "nymora-accumulator",
    "nymora-circuits",
    "nymora-proofs",
    "nymora-protocol",
    "nymora-ports",
]

[workspace.package]
version = "0.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.81"   # core::error::Error (nymora-core is no_std)
repository = "https://github.com/xyberal/nymora"
# Provisional primitives (§15): nothing here is releasable to crates.io yet.
publish = false

# Every crate in this workspace inherits these lints (see `[lints] workspace = true`).
[workspace.lints.rust]
unsafe_code = "forbid"        # nymora is pure protocol; all unsafe/FFI lives in ../bindings/
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
