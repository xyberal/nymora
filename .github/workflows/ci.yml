# nymora's OWN CI.
#
# DORMANT in the monorepo: GitHub only runs workflows found at the repository root under
# .github/workflows/, and here this file lives at nymora/.github/workflows/. Once the
# subtree-split makes nymora/ the ROOT of the public repo, this path becomes
# .github/workflows/ci.yml and activates automatically. All commands below assume nymora/
# is the working directory (true after the split; use `just nymora-ci` in the monorepo).
name: nymora CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features --workspace
      # --all-features alone would never exercise the member-shaped builds: no
      # allocator in the accumulator, no operator role, no stub backend. Those are
      # the configurations a Persora actually compiles.
      - name: Test the member-shaped builds
        run: |
          cargo test -p nymora-crypto --no-default-features
          cargo test -p nymora-protocol --no-default-features
          cargo test -p nymora-circuits --no-default-features
          cargo test -p nymora-proofs --no-default-features
          cargo test -p nymora-accumulator --no-default-features
      # The proving backend is a standalone crate (outside the workspace, like
      # measure/) so the library workspace keeps its no_std discipline; it gets its
      # own explicit steps. Tests run in release: they produce real proofs.
      - name: Proving backend (nymora-plonk)
        run: |
          cd nymora-plonk
          cargo fmt --all --check
          cargo clippy --all-targets -- -D warnings
          cargo test --release
      - name: License headers
        run: ./scripts/check-license-headers.sh

  audit:
    # Dependency advisories (RustSec), for the workspace and the proving backend
    # alike. A new advisory fails this job without blocking unrelated work in
    # build-test — the split is deliberate.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit the workspace
        run: cargo audit
      - name: Audit the proving backend
        run: cd nymora-plonk && cargo audit

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan covers history, not just the tree: a secret committed and later
          # deleted still travels with every clone.
          fetch-depth: 0
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks 2>/dev/null || sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      # Configuration and allowlist: .gitleaks.toml at the workspace root.
      - name: Scan tree and history
        run: gitleaks git --no-banner --redact .
