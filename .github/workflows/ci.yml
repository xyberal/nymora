# nymora's OWN CI.
#
# DORMANT in the monorepo: GitHub only runs workflows found at the repository root under
# .github/workflows/, and here this file lives at nymora/.github/workflows/. Once the
# subtree-split makes nymora/ the ROOT of the public repo, this path becomes
# .github/workflows/ci.yml and activates automatically. All commands below assume nymora/
# is the working directory (true after the split; use `just nymora-ci` in the monorepo).
name: nymora CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-features --workspace
      # --all-features would never exercise the build that omits the stand-in algebraic
      # hash, which is the configuration to check against before shipping.
      - name: Test without the provisional algebraic hash
        run: cargo test -p nymora-crypto --no-default-features
      - name: Test the lifecycle without the provisional algebraic hash
        run: cargo test -p nymora-protocol --no-default-features
      - name: Test the proof layer without the stand-ins
        run: |
          cargo test -p nymora-circuits --no-default-features
          cargo test -p nymora-proofs --no-default-features
          cargo test -p nymora-accumulator --no-default-features
      - name: License headers
        run: ./scripts/check-license-headers.sh

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The scan covers history, not just the tree: a secret committed and later
          # deleted still travels with every clone.
          fetch-depth: 0
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks 2>/dev/null || sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      # Configuration and allowlist: .gitleaks.toml at the workspace root.
      - name: Scan tree and history
        run: gitleaks git --no-banner --redact .
