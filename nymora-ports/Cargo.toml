[package]
name = "nymora-ports"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# A reference `KeyStore` for development and tests. Off by default: it is not production
# custody, and a library that shipped it enabled invites exactly the accident it is named
# to prevent. `just ci` builds with `--all-features`, so it is covered.
software-key-store = ["dep:sha2"]

[dependencies]
nymora-core = { path = "../nymora-core" }
# Used only by `software-key-store`, and only for values no counterparty recomputes — see
# that module on why it does not reach for `nymora-crypto`.
sha2 = { version = "0.10", default-features = false, optional = true }
