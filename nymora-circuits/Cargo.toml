[package]
name = "nymora-circuits"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
default = ["stub-prover"]
# The stub prover: a plaintext evaluator of the exact statements over the real
# primitives, for testing everything above the proof boundary without paying for
# proving. Its proofs contain the witness in the clear — see the module documentation —
# and must never leave a test process.
stub-prover = ["dep:sha2"]

[dependencies]
nymora-core = { path = "../nymora-core" }
nymora-crypto = { path = "../nymora-crypto", default-features = false }
nymora-accumulator = { path = "../nymora-accumulator", default-features = false }
# Stub only, for the local public-input binding digest — a value with no counterparty,
# like the software key store's seed derivations.
sha2 = { version = "0.10", default-features = false, optional = true }

[dev-dependencies]
# Tests build the trees and sets the statements are proven against.
nymora-accumulator = { path = "../nymora-accumulator", default-features = false, features = [
    "build",
] }
