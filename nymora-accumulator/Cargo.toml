[package]
name = "nymora-accumulator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[features]
# Tree and set construction, for an operator and for the member's local rebuild of the
# exclusion sets. Needs an allocator, which the verification half does not, so it is off
# by default and the member-side proving path stays allocation-free.
build = []

[dependencies]
nymora-core = { path = "../nymora-core" }
nymora-crypto = { path = "../nymora-crypto", default-features = false }
# Branchless selection: which child a node is depends on a bit of the member's index, and the
# index is their position in the membership set (§5.2).
subtle = { version = "2", default-features = false }

[dev-dependencies]
# Conformance vectors are JSON, for a second implementation in another language to consume.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
